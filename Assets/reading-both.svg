  <rect width="209" height="28" rx="6" fill="#1E2130"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="10" y="19" textLength="63" lengthAdjust="spacingAndGlyphs" fill="#FF6B6B">mic -41</text>
    <rect x="82" y="18" width="9" height="4" fill="#FF6B6B"/>
    <text x="100" y="19" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#8A8FA8">·</text>
    <text x="118" y="19" textLength="63" lengthAdjust="spacingAndGlyphs" fill="#4ADE80">out -14</text>
    <rect x="190" y="10" width="9" height="12" fill="#4ADE80"/>
  </g>
</svg>
